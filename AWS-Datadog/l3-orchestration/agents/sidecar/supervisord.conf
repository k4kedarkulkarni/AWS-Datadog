; Multi-process supervisor for the Datadog-telemetry agent container.
; Runs the Datadog trace-agent (APM intake on :8126) alongside the A2A agent.
; The agent runs under `ddtrace-run` so its ai_guard span has a tracer that
; ships to the in-container trace-agent, which forwards to Datadog's trace intake.
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

; Datadog trace-agent ONLY (no core infra agent — not needed for APM spans).
[program:trace-agent]
command=/opt/datadog-agent/embedded/bin/trace-agent -c /etc/datadog-agent/datadog.yaml
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The A2A agent. AGENT_MODULE (set by entrypoint.sh from AGENT_MODULE env, e.g.
; agents.order_agent_a2a / agents.refund_agent_a2a) selects order vs refund.
; `ddtrace-run` instruments the process so the ai_guard span is emitted.
[program:agent]
command=ddtrace-run python -u -m %(ENV_AGENT_MODULE)s
directory=/app
priority=20
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
